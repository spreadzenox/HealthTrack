apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply from: 'face-models.gradle'

// Lecture du visage au déverrouillage dans la variante play (POL-1, journal/PLAY-CONFORMITE.md §1 bis) : COUPÉE par
// défaut, pour que les versions play partent même si Google refuse la déclaration des services de premier plan (P28).
// -PfaceUnlockPlay=true l'allume : manifeste src/playFaceUnlock (service caméra gardé, sans relance ni exemption de
// batterie). -PplayPreview=true ajoute le suffixe « .apercu » (APK à filmer pour P28, à côté de l'app du Play Store).
def faceUnlockPlay = (project.findProperty('faceUnlockPlay') ?: 'false').toBoolean()
def playPreview = (project.findProperty('playPreview') ?: 'false').toBoolean()

android {
    namespace "com.healthtrack.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.healthtrack.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Numéro du run « Build & Release » (-PhtVersionCode=…) : Google Play exige un versionCode croissant ;
        // la variante play passe aussi -PhtVersionName (nombre de commits, versionCode = 100000 + n)
        versionCode((project.findProperty('htVersionCode') ?: '1') as int)
        versionName((project.findProperty('htVersionName') ?: project.findProperty('htVersionCode') ?: '1.0') as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // LiteRT n'embarque que les ABI utiles (I95) : téléphones 64 bits ; l'émulateur de la CI ajoute x86_64
        // (./gradlew -PextraAbis=x86_64), 6 Mo inutiles sur le téléphone
        ndk {
            abiFilters(*(['arm64-v8a'] + (project.findProperty('extraAbis') ?: '').tokenize(',')))
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Deux variantes depuis le même code (journal/PRODUIT.md, jalon 3) :
    // - sideload : la version complète publiée sur GitHub Releases, mise à jour en un clic ; garde l'identifiant
    //   historique pour que les mises à jour s'installent par-dessus sans perte de données.
    // - play : la version Google Play, sans REQUEST_INSTALL_PACKAGES ni auto-mise à jour. Identifiant neutre et
    //   définitif (Google Play ne permet jamais de le changer), sans nom commercial, distinct de la sideload pour que
    //   les deux coexistent sur un téléphone.
    flavorDimensions 'distribution'
    productFlavors {
        sideload {
            dimension 'distribution'
            applicationId 'com.healthtrack.app'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
            // Lecture du visage au déverrouillage, app fermée (service caméra), avec relance horaire / au démarrage,
            // exemption de batterie et guides Shizuku / ADB (FACE_KEEPALIVE) : sideload.
            buildConfigField 'boolean', 'FACE_UNLOCK', 'true'
            buildConfigField 'boolean', 'FACE_KEEPALIVE', 'true'
        }
        play {
            dimension 'distribution'
            applicationId 'fr.jpesquet.sante'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
            if (playPreview) applicationIdSuffix '.apercu'
            // Play : lecture du visage à l'ouverture de l'app (journal/PLAY-CONFORMITE.md, option B) ; au déverrouillage
            // en plus seulement si l'interrupteur faceUnlockPlay est allumé (POL-1), jamais de relance en arrière-plan.
            buildConfigField 'boolean', 'FACE_UNLOCK', faceUnlockPlay ? 'true' : 'false'
            buildConfigField 'boolean', 'FACE_KEEPALIVE', 'false'
            // Symboles de débogage natifs dans l'AAB : Play les extrait seul pour lisibiliser les plantages natifs.
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Clé d'envoi de la variante play (PKCS12, alias « upload ») : fournie par la CI depuis Secret Manager
        // (workflow « Play — AAB »), jamais dans le dépôt. Sans elle, l'AAB release sort non signé.
        if (System.getenv('HT_UPLOAD_KEYSTORE')) {
            upload {
                storeFile file(System.getenv('HT_UPLOAD_KEYSTORE'))
                storeType 'pkcs12'
                storePassword System.getenv('HT_UPLOAD_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('HT_UPLOAD_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('HT_UPLOAD_KEYSTORE')) {
                signingConfig signingConfigs.upload
            }
        }
    }
    // Modèles du visage stockés sans compression : projetés en mémoire par FaceModels
    androidResources {
        noCompress 'tflite'
    }
    sourceSets {
        main {
            assets.srcDir faceModelsAssetsDir
        }
        androidTest {
            // Vecteurs du pipeline visage (images du domaine public + sorties attendues) pour FaceModelsTest
            assets.srcDir 'src/test/resources'
        }
        // Interrupteur POL-1 allumé : même manifeste play, sans le retrait du service caméra (test de parité dans
        // src/config/distribution.android.test.js).
        if (faceUnlockPlay) play { manifest.srcFile 'src/playFaceUnlock/AndroidManifest.xml' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // EdgeToEdge.enable (MainActivity, bord à bord sous Android 8 à 14)
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Moteur d'inférence du visage, sans dépendance transitive (la 2.x tire ai-delivery des services Play)
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    // Modèle valence / éveil du visage (FaceAffectModel, publié en ONNX par ses auteurs). Rester en 1.22.x : à partir
    // de la 1.27, l'AAR Android ajoute un TelemetryInitializer qui envoie des infos de l'appareil à Microsoft (rien ne
    // doit sortir du téléphone) ; arm64 seul via abiFilters, ≈ 18 Mo.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    // Google Play Billing (abonnement, jalon 6c-2) : variante play seulement, la sideload n'a ni la bibliothèque ni la
    // permission BILLING. PBL 8 minimum exigée par Google Play depuis le 1/11/2026.
    playImplementation 'com.android.billingclient:billing:8.3.0'
    // Play Integrity (jalon 6b-2b) : jeton joint aux analyses IA, vérifié par le relais ; variante play seulement.
    playImplementation 'com.google.android.play:integrity:1.6.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // Health Connect client — needed by HealthConnectTest instrumented tests
    androidTestImplementation 'androidx.health.connect:connect-client:1.1.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.named('preBuild') { dependsOn 'faceModels' }
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn 'faceModels' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
