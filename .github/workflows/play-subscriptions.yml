# Abonnements Google Play (étape 6d, journal/IDEES.md I158) : Silver `halcya_premium`, formules `annuel` (29,99 €/an)
# et `mensuel` (4,99 €/mois), essai gratuit de 14 jours sur l'annuel ; Gold `halcya_gold` (GOLD-b3), formule `mensuel`
# (9,99 €/mois), sans essai ; grâce + suspension de compte (app/scripts/play/subscriptions.mjs). Idempotent : ne crée que ce qui manque, n'active que les brouillons, ne
# modifie jamais un prix existant. Connexion sans clé (Workload Identity Federation, main uniquement).
# Refus de Google (accès, profil de paiement pas encore vérifié) → avertissement avec l'erreur exacte, pas d'échec.
# Envois espacés (CD-ALPHA-5, 05/11) : comme l'alpha, un envoi examiné par Google 24 h au plus après le dernier
# (alpha, fiche ou abonnements) ; sinon il est reporté au passage quotidien (app/scripts/play/reviewGate.mjs).
name: Play — abonnements

on:
  push:
    branches: [main]
    paths:
      - "app/scripts/play/subscriptions*.mjs"
      - "app/src/config/premiumBenefits.js"
      - ".github/workflows/play-subscriptions.yml"
  schedule:
    - cron: "33 7 * * *"  # envoi reporté par la porte des 24 h (CD-ALPHA-5), seulement s'il attend
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: play-subscriptions
  cancel-in-progress: false

jobs:
  subscriptions:
    name: Abonnements halcya_premium et halcya_gold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Catalogue prévu
        working-directory: app
        run: GITHUB_STEP_SUMMARY= node scripts/play/subscriptions-cli.mjs

      - name: Jeton Google Play (portée androidpublisher)
        id: play-token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/81378799481/locations/global/workloadIdentityPools/github/providers/healthtrack-main
          service_account: gh-deployer@healthtrack-824b26.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Délai entre deux envois examinés par Google
        id: gate
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.play-token.outputs.access_token }}
        run: node scripts/play/review-gate-cli.mjs subscriptions

      - name: Créer et activer les abonnements (Google Play)
        if: steps.gate.outputs.send == 'true'
        working-directory: app
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-token.outputs.access_token }}
        run: |
          set +e
          node scripts/play/subscriptions-cli.mjs
          code=$?
          if [ "$code" = 2 ]; then exit 0; fi
          exit "$code"
