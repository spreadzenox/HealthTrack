# Livraison vers le test fermé (alpha) — un envoi par jour à heure fixe (CD-ALPHA-6, décision du propriétaire du
# 07/11 vers 17:30 : « chaque modification arrive aux testeurs au fur et à mesure, une fois par jour »).
#
# - Chaque soir à 23:45, heure de Paris : envoie sur l'alpha la plus récente version de main dont « Build & Release »,
#   « Tests », les émulateurs (dont Android 9) et « Play — AAB » ont réussi, si elle a changé depuis le dernier envoi.
#   Décision testée dans app/scripts/play/alphaGate.mjs (decideNightly).
# - CRON EN UTC : 22:45 UTC = 23:45 à Paris en heure d'hiver. À RECALER au passage à l'heure d'été (29/03/2027) :
#   "45 21 * * *" ; puis de nouveau "45 22 * * *" à l'heure d'hiver (31/10/2027).
# - Plus d'envoi à chaque merge ni à 07:13 ; le test interne reçoit toujours chaque version (« Play — AAB »).
#   Plus d'espacement de 24 h (CD-ALPHA-2) : le rythme quotidien en tient lieu ; le gel (review-freeze.json) reste.
# - Aucun AAB reconstruit : la version déjà envoyée en test interne est placée telle quelle sur l'alpha (reuseOnly).
# - Jamais la production (publish.mjs n'accepte que internal et alpha). La production reste le clic du propriétaire.
# - Frein : ALPHA_AUTO "false" coupe les envois. workflow_dispatch : même décision, à la demande.
# - schedule et workflow_dispatch s'exécutent sur main (refs/heads/main) : la connexion sans clé est acceptée.
name: Play — Alpha (livraison continue)

on:
  schedule:
    - cron: "45 22 * * *"  # 23:45 à Paris (heure d'hiver) — à recaler au changement d'heure (voir en tête)
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: play-edits  # un seul edit Google Play à la fois (avec « Play — AAB » et « Play — fiche du Store »)
  cancel-in-progress: false

env:
  ALPHA_AUTO: "true"

jobs:
  alpha:
    name: Version de main sur l'alpha
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Jeton Google Play (portée androidpublisher)
        id: play-token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/81378799481/locations/global/workloadIdentityPools/github/providers/healthtrack-main
          service_account: gh-deployer@healthtrack-824b26.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Décider et envoyer
        working-directory: app
        env:
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.play-token.outputs.access_token }}
        run: node scripts/play/alpha-cli.mjs
