# Déploiement du relais Halcya sur Cloud Run (journal/INFRA.md, jalon 6a de journal/PRODUIT.md).
#
# - Connexion à Google Cloud sans clé (Workload Identity Federation, main seulement) sous gh-deployer, qui construit
#   l'image, la pousse dans Artifact Registry et déploie le service sous l'identité relay-runtime (Vertex AI).
# - Service public (l'app l'appelle) qui se protège lui-même : plafonds par installation / jour / minute, une seule
#   instance au plus, zéro instance au repos (rien à payer quand personne ne s'en sert).
# - Vérification après déploiement : /health puis une vraie analyse de texte (« une pomme ») ; le modèle et la région
#   qui ont répondu sont écrits dans le résumé du workflow.
# - Abonnements Google Play (jalon 6b) : abonnement push « play-rtdn-relay » du sujet play-rtdn vers /pubsub/rtdn,
#   authentifié par un jeton OIDC de relay-runtime (créé ou mis à jour ici), puis un essai de vérification d'achat
#   avec un faux jeton qui dit si relay-runtime a déjà accès à l'API Android Publisher (non bloquant : l'invitation
#   dans la Play Console peut mettre 24 à 48 h à prendre effet).
#   Registre des crédits (P24) : après l'analyse de test, le résumé dit si relay-runtime a lu et écrit Firestore sans échec.
name: Relais — déploiement

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - "app/src/data/ingredientsNutrition.json"
      - ".github/workflows/relay-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relay-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: healthtrack-824b26
  GCP_PROJECT_NUMBER: "81378799481"
  REGION: europe-west1
  SERVICE: halcya-relay
  IMAGE: europe-west1-docker.pkg.dev/healthtrack-824b26/healthtrack/halcya-relay
  RELAY_URL: https://halcya-relay-81378799481.europe-west1.run.app
  RUNTIME_SA: relay-runtime@healthtrack-824b26.iam.gserviceaccount.com

jobs:
  deploy:
    name: Construire et déployer le relais
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests du relais
        run: cd relay && npm test

      - name: Connexion à Google Cloud (sans clé)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/81378799481/locations/global/workloadIdentityPools/github/providers/healthtrack-main
          service_account: gh-deployer@healthtrack-824b26.iam.gserviceaccount.com

      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Construire et pousser l'image
        run: |
          set -euo pipefail
          mkdir -p relay/data
          cp app/src/data/ingredientsNutrition.json relay/data/ingredients.json
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" relay
          if ! docker push "$IMAGE:$GITHUB_SHA" 2> "$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err" >&2
            echo "::error title=Envoi de l'image refusé::Artifact Registry n'accepte pas l'image (dépôt healthtrack absent en $REGION, ou droit artifactregistry.writer manquant pour gh-deployer). Voir journal/INFRA.md ; ne rien contourner, ajouter l'action du propriétaire correspondante."
            exit 1
          fi

      - name: Déployer sur Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$GCP_PROJECT" --region="$REGION" \
            --image="$IMAGE:$GITHUB_SHA" \
            --service-account="relay-runtime@${GCP_PROJECT}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=1 --concurrency=8 \
            --cpu=1 --memory=512Mi --timeout=60 \
            --set-env-vars="^;^VERTEX_PROJECT=${GCP_PROJECT};VERTEX_LOCATIONS=eu,europe-west1;VERTEX_MODELS=gemini-3.5-flash-lite,gemini-3.1-flash-lite;VERTEX_TIMEOUT_MS=30000;GOLD_MODELS=gemini-3.8-flash;GOLD_LOCATIONS=eu;GOLD_THINKING_LEVEL=MEDIUM;GOLD_TIMEOUT_MS=25000;GOLD_DAILY_CAP=40;GOLD_MONTHLY_EUR=15;STOP_MONTHLY_EUR=19;GLOBAL_DAILY_CAP=150;INSTALL_DAILY_CAP=20;GLOBAL_PER_MINUTE_CAP=10;PLAY_PACKAGE=fr.jpesquet.sante;PUBLIC_URL=${RELAY_URL};RTDN_SERVICE_ACCOUNT=${RUNTIME_SA};INTEGRITY_MODE=observe" \
            --quiet

      - name: Vérifier le service (santé + une analyse de texte)
        run: |
          set -euo pipefail
          URL="$RELAY_URL"
          {
            echo "## Relais Halcya déployé"
            echo
            echo "- Adresse : $URL"
            echo "- Image : \`$IMAGE:$GITHUB_SHA\`"
            # Période de lancement (P23 ②) : relay/src/launch-period.json, embarqué dans l'image
            jq -r 'if .off then "- Période de lancement : coupée (off)"
                   elif (.until // "") == "" then "- Période de lancement : aucune"
                   else "- Période de lancement : premium offert du \(if (.from // "") == "" then "déploiement" else .from end) au \(.until) (UTC)" end' \
              relay/src/launch-period.json
          } >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/health"
          echo
          status=$(curl -sS -o "$RUNNER_TEMP/smoke.json" -w '%{http_code}' --max-time 90 \
            -X POST "$URL/v1/meal/analyze" \
            -H 'Content-Type: application/json' -H "X-Install-Id: ci-smoke-${GITHUB_RUN_ID}" \
            -d '{"kind":"text","description":"une pomme et un yaourt nature"}')
          model=$(jq -r '.model // "—"' "$RUNNER_TEMP/smoke.json")
          dish=$(jq -r '.parsed.dish // .message // "—"' "$RUNNER_TEMP/smoke.json")
          count=$(jq -r '(.parsed.ingredients // []) | length' "$RUNNER_TEMP/smoke.json")
          echo "- Analyse de test : HTTP $status, modèle \`$model\`, « $dish », $count ingrédient(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP $status, modèle $model, plat « $dish », $count ingrédient(s)"
          if [ "$status" != "200" ] || [ "$count" = "0" ]; then
            # Message exact de Vertex AI (le relais ne journalise ni le contenu ni l'identifiant d'installation)
            # Cloud Logging met parfois plus d'une minute à indexer : on réessaie jusqu'à ~2 min
            for i in 1 2 3 4 5 6 7 8; do
              sleep 15
              gcloud logging read \
                "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND jsonPayload.event=\"error\"" \
                --project="$GCP_PROJECT" --limit=3 --freshness=15m \
                --format='value(timestamp,jsonPayload.status,jsonPayload.message)' > "$RUNNER_TEMP/errors.txt" 2>&1 || true
              [ -s "$RUNNER_TEMP/errors.txt" ] && break
            done
            sed 's/^/Journal du relais : /' "$RUNNER_TEMP/errors.txt" | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo "::error title=Analyse de test échouée::Le relais répond mais l'analyse Vertex AI n'a pas abouti (HTTP $status). Lire les journaux du service $SERVICE (Cloud Logging, événement « error ») : modèle absent de la région, ou rôle aiplatform.user manquant pour relay-runtime."
            exit 1
          fi

      - name: Registre des crédits (Firestore, non bloquant)
        continue-on-error: true
        run: |
          set -uo pipefail
          # L'analyse de test ci-dessus a lu puis réécrit le registre des crédits (P24) : sans échec
          # « credits_store_failed » dans les minutes qui suivent, relay-runtime lit et écrit bien dans Firestore.
          # Cloud Logging indexe avec un peu de retard : on attend 45 s avant de lire.
          sleep 45
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND jsonPayload.event=\"credits_store_failed\"" \
            --project="$GCP_PROJECT" --freshness=7d --limit=500 --format=json > "$RUNNER_TEMP/credits.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/credits.json"
          recent=$(jq --arg since "$(date -u -d '-10 min' +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select(.timestamp >= $since)] | length' "$RUNNER_TEMP/credits.json")
          week=$(jq 'length' "$RUNNER_TEMP/credits.json")
          detail=$(jq -r 'group_by([.jsonPayload.op, .jsonPayload.status])[] | "\(.[0].jsonPayload.op) HTTP \(.[0].jsonPayload.status // "—") × \(length)"' "$RUNNER_TEMP/credits.json" | paste -sd ',' - | sed 's/,/, /g')
          if [ "$recent" = "0" ]; then
            verdict="✅ lu et écrit sans échec pendant l'analyse de test"
          else
            verdict="⚠️ $recent échec(s) pendant l'analyse de test (rôle roles/datastore.user de relay-runtime ? base « (default) » ?)"
          fi
          echo "- Registre des crédits (Firestore) : $verdict ; 7 derniers jours : $week échec(s)${detail:+ ($detail)}" >> "$GITHUB_STEP_SUMMARY"
          echo "Firestore : $recent échec(s) récents, $week sur 7 jours ${detail}"
          [ "$recent" = "0" ]

      - name: Nouvelles installations (crédits IA, non bloquant)
        continue-on-error: true
        run: |
          set -uo pipefail
          # CREDITS-INSTALLS : le relais écrit « first_credit » (sans identifiant) quand une installation inconnue du
          # registre prend son premier crédit IA ; l'analyse de test du workflow n'est pas comptée. Si ce nombre
          # s'envole (réinstallations pour récupérer les crédits offerts), passer à 5 crédits offerts.
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND jsonPayload.event=\"first_credit\"" \
            --project="$GCP_PROJECT" --freshness=7d --limit=1000 --format=json > "$RUNNER_TEMP/installs.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/installs.json"
          total=$(jq 'length' "$RUNNER_TEMP/installs.json")
          # Robots du rapport de pré-lancement (Firebase Test Lab, champ testlab depuis INSTALLS-21) : comptés à part
          robots=$(jq '[.[] | select(.jsonPayload.testlab == true)] | length' "$RUNNER_TEMP/installs.json")
          perday=$(jq -r 'group_by(.timestamp[0:10])[] | "\(.[0].timestamp[0:10]) : \(length)"' "$RUNNER_TEMP/installs.json" | paste -sd ',' - | sed 's/,/, /g')
          echo "- Nouvelles installations qui prennent leur 1er crédit IA (7 derniers jours) : $total${perday:+ ($perday)}, dont $robots robot(s) du rapport de pré-lancement de Google" >> "$GITHUB_STEP_SUMMARY"
          echo "Nouvelles installations : $total sur 7 jours ${perday}"

      - name: Notifications Google Play (abonnement push play-rtdn → relais)
        continue-on-error: true
        run: |
          set -uo pipefail
          SUB=play-rtdn-relay
          ENDPOINT="$RELAY_URL/pubsub/rtdn"
          common=(--project="$GCP_PROJECT" --push-endpoint="$ENDPOINT" \
            --push-auth-service-account="$RUNTIME_SA" --push-auth-token-audience="$ENDPOINT" \
            --ack-deadline=30 --message-retention-duration=1d \
            --min-retry-delay=10s --max-retry-delay=600s)
          if gcloud pubsub subscriptions describe "$SUB" --project="$GCP_PROJECT" --format='value(name)' >/dev/null 2>&1; then
            gcloud pubsub subscriptions update "$SUB" "${common[@]}" --quiet 2> "$RUNNER_TEMP/sub.err"
          else
            gcloud pubsub subscriptions create "$SUB" --topic=play-rtdn --expiration-period=never "${common[@]}" --quiet 2> "$RUNNER_TEMP/sub.err"
          fi
          rc=$?
          if [ "$rc" = "0" ]; then
            echo "- Notifications Play : abonnement push \`$SUB\` → \`$ENDPOINT\` (jeton OIDC de relay-runtime)" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/sub.err" >&2
            echo "- ⚠️ Notifications Play : abonnement \`$SUB\` non créé (voir le journal de l'étape)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Abonnement play-rtdn non créé::$(tail -1 "$RUNNER_TEMP/sub.err")"
            exit 1
          fi

      - name: Accès à Google Play (faux jeton d'achat, non bloquant)
        continue-on-error: true
        run: |
          set -uo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/verify.json" -w '%{http_code}' --max-time 30 \
            -X POST "$RELAY_URL/v1/subscription/verify" \
            -H 'Content-Type: application/json' -H "X-Install-Id: ci-smoke-${GITHUB_RUN_ID}" \
            -d '{"purchaseToken":"ci-faux-jeton-sans-achat-0000000000"}')
          case "$status" in
            404) verdict="✅ relay-runtime lit les achats Google Play (faux jeton reconnu comme inconnu)" ;;
            502) verdict="⏳ Google Play refuse encore relay-runtime (invitation pas encore active, ou droits manquants) : voir l'événement « error » route /v1/subscription/verify dans Cloud Logging" ;;
            *) verdict="❓ réponse inattendue HTTP $status" ;;
          esac
          echo "- Vérification d'achat : HTTP $status — $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP $status — $verdict"
          # Période de lancement vue par l'app (sans jeton d'achat) : premium et échéance renvoyés par le relais
          launch=$(curl -sS --max-time 30 -X POST "$RELAY_URL/v1/subscription/verify" \
            -H 'Content-Type: application/json' -H "X-Install-Id: ci-smoke-${GITHUB_RUN_ID}" -d '{}' \
            | jq -r '"premium=\(.premium) source=\(.source // "—") jusqu’au \(.launchUntil // "—")"' 2>/dev/null || echo "illisible")
          echo "- Installation sans achat : $launch" >> "$GITHUB_STEP_SUMMARY"
          sleep 3
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND jsonPayload.route=\"/v1/subscription/verify\"" \
            --project="$GCP_PROJECT" --limit=1 --freshness=10m --format='value(jsonPayload.status,jsonPayload.message)' 2>/dev/null \
            | sed 's/^/Journal : /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          [ "$status" = "404" ]

      - name: Bilan Play Integrity des 7 derniers jours (6b-2c, non bloquant)
        continue-on-error: true
        run: |
          set -uo pipefail
          # Avant de passer le relais en mode « enforce », on regarde ce que les vrais téléphones envoient.
          # Les essais de la CI (identifiant ci-smoke-…) n'ont jamais de jeton : colonne « Origine » (champ ci, 6b-2c-2) ;
          # « robots Google » : appareils Firebase Test Lab du rapport de pré-lancement, signalés par l'app (testlab, INSTALLS-21).
          # « Raison » : verdict refusé (reasons) ou, sans jeton, ce que l'app a répondu (client : timeout, backoff,
          # error:<code Google Play>, no_plugin ; « none » = version de l'app antérieure à 6b-2c-2).
          # « iPhone » : requêtes X-Platform: ios (ou no_plugin sans X-Platform), statut not_android, jamais bloquées (App Attest plus tard).
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND jsonPayload.event=\"integrity\"" \
            --project="$GCP_PROJECT" --freshness=7d --limit=1000 --format=json > "$RUNNER_TEMP/integrity.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/integrity.json"
          total=$(jq 'length' "$RUNNER_TEMP/integrity.json")
          {
            echo
            echo "### Play Integrity — 7 derniers jours ($total événement(s))"
            echo
            echo "| Origine | Statut | Mode | Raison | Installations | Événements |"
            echo "|---|---|---|---|---|---|"
            jq -r 'map(. + { origin: (if .jsonPayload.ci == true then "CI" elif .jsonPayload.platform == "ios" then "iPhone" elif .jsonPayload.testlab == true then "robots Google" elif .jsonPayload.ci == false then "téléphones" else "—" end),
                            why: ((.jsonPayload.reasons // []) + (if .jsonPayload.client then [.jsonPayload.client] else [] end) | join(", ") | if . == "" then "—" else . end) })
              | group_by([.origin, .jsonPayload.status, .jsonPayload.mode, .why])[]
              | "| \(.[0].origin) | \(.[0].jsonPayload.status) | \(.[0].jsonPayload.mode // "—") | \(.[0].why) | \(map(.jsonPayload.install // "—") | unique | length) | \(length) |"' \
              "$RUNNER_TEMP/integrity.json"
            echo
            jq -r '(map(select(.jsonPayload.ci != true)) | length) as $n | (map(select(.jsonPayload.platform == "ios")) | length) as $ios
              | "Part des requêtes iPhone (hors CI) : \($ios) sur \($n)" + (if $n > 0 then " (\($ios * 100 / $n | floor) %)" else "" end)' \
              "$RUNNER_TEMP/integrity.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Analyses IA des 7 derniers jours (Gold / Silver, GOLD-a2, non bloquant)
        continue-on-error: true
        run: |
          set -uo pipefail
          # GOLD-a2 : quel niveau a été servi (gold = Gemini Flash, lite = Flash-Lite), par quel modèle, combien de fois
          # Gold est retombé sur Flash-Lite et pourquoi (timeout, error + statut Vertex, plafond gold_cap / gold_budget),
          # et le coût Vertex estimé. Les analyses de test de la CI (ci-smoke-…, champ ci) sont comptées à part.
          # Aucun contenu ni identifiant d'installation n'est journalisé (seulement son empreinte, comptée ici).
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND (jsonPayload.event=\"analyze\" OR jsonPayload.event=\"gold_fallback\")" \
            --project="$GCP_PROJECT" --freshness=7d --limit=2000 --format=json > "$RUNNER_TEMP/analyses.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/analyses.json"
          {
            echo
            echo "### Analyses IA — 7 derniers jours"
            echo
            echo "| Origine | Niveau | Servi | Modèle | Zone | Analyses | Installations | Coût estimé |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r '[.[] | select(.jsonPayload.event == "analyze")]
              | map(. + { origin: (if .jsonPayload.ci == true then "CI" else "téléphones" end) })
              | group_by([.origin, .jsonPayload.tier, .jsonPayload.served, .jsonPayload.model, .jsonPayload.location])[]
              | "| \(.[0].origin) | \(.[0].jsonPayload.tier // "—") | \(.[0].jsonPayload.served // "—") | `\(.[0].jsonPayload.model // "—")` | \(.[0].jsonPayload.location // "—") | \(length) | \(map(.jsonPayload.install // "—") | unique | length) | \(map(.jsonPayload.eur // 0) | add * 1000 | round / 1000) € |"' \
              "$RUNNER_TEMP/analyses.json"
            echo
            jq -r '[.[] | select(.jsonPayload.event == "gold_fallback")] as $f
              | if ($f | length) == 0 then "Gold retombé sur Flash-Lite : jamais"
                else "Gold retombé sur Flash-Lite : " + ($f | group_by([.jsonPayload.reason, .jsonPayload.status])
                  | map("\(.[0].jsonPayload.reason // "—")\(if .[0].jsonPayload.status then " HTTP \(.[0].jsonPayload.status)" else "" end) × \(length)") | join(", ")) end' \
              "$RUNNER_TEMP/analyses.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"
