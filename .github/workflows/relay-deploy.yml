# Déploiement du relais Halcya sur Cloud Run (journal/INFRA.md, jalon 6a de journal/PRODUIT.md).
#
# - Connexion à Google Cloud sans clé (Workload Identity Federation, main seulement) sous gh-deployer, qui construit
#   l'image, la pousse dans Artifact Registry et déploie le service sous l'identité relay-runtime (Vertex AI).
# - Service public (l'app l'appelle) qui se protège lui-même : plafonds par installation / jour / minute, une seule
#   instance au plus, zéro instance au repos (rien à payer quand personne ne s'en sert).
# - Vérification après déploiement : /health puis une vraie analyse de texte (« une pomme ») ; le modèle et la région
#   qui ont répondu sont écrits dans le résumé du workflow.
# - Abonnements Google Play (jalon 6b) : abonnement push « play-rtdn-relay » du sujet play-rtdn vers /pubsub/rtdn,
#   authentifié par un jeton OIDC de relay-runtime (créé ou mis à jour ici), puis un essai de vérification d'achat
#   avec un faux jeton qui dit si relay-runtime a déjà accès à l'API Android Publisher (non bloquant : l'invitation
#   dans la Play Console peut mettre 24 à 48 h à prendre effet).
name: Relais — déploiement

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - "app/src/data/ingredientsNutrition.json"
      - ".github/workflows/relay-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relay-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: healthtrack-824b26
  GCP_PROJECT_NUMBER: "81378799481"
  REGION: europe-west1
  SERVICE: halcya-relay
  IMAGE: europe-west1-docker.pkg.dev/healthtrack-824b26/healthtrack/halcya-relay
  RELAY_URL: https://halcya-relay-81378799481.europe-west1.run.app
  RUNTIME_SA: relay-runtime@healthtrack-824b26.iam.gserviceaccount.com

jobs:
  deploy:
    name: Construire et déployer le relais
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests du relais
        run: cd relay && npm test

      - name: Connexion à Google Cloud (sans clé)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/81378799481/locations/global/workloadIdentityPools/github/providers/healthtrack-main
          service_account: gh-deployer@healthtrack-824b26.iam.gserviceaccount.com

      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Construire et pousser l'image
        run: |
          set -euo pipefail
          mkdir -p relay/data
          cp app/src/data/ingredientsNutrition.json relay/data/ingredients.json
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" relay
          if ! docker push "$IMAGE:$GITHUB_SHA" 2> "$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err" >&2
            echo "::error title=Envoi de l'image refusé::Artifact Registry n'accepte pas l'image (dépôt healthtrack absent en $REGION, ou droit artifactregistry.writer manquant pour gh-deployer). Voir journal/INFRA.md ; ne rien contourner, ajouter l'action du propriétaire correspondante."
            exit 1
          fi

      - name: Déployer sur Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$GCP_PROJECT" --region="$REGION" \
            --image="$IMAGE:$GITHUB_SHA" \
            --service-account="relay-runtime@${GCP_PROJECT}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=1 --concurrency=8 \
            --cpu=1 --memory=512Mi --timeout=60 \
            --set-env-vars="^;^VERTEX_PROJECT=${GCP_PROJECT};VERTEX_LOCATIONS=eu,europe-west1;VERTEX_MODELS=gemini-3.5-flash-lite,gemini-3.1-flash-lite;GLOBAL_DAILY_CAP=200;INSTALL_DAILY_CAP=20;GLOBAL_PER_MINUTE_CAP=10;PLAY_PACKAGE=fr.jpesquet.sante;PUBLIC_URL=${RELAY_URL};RTDN_SERVICE_ACCOUNT=${RUNTIME_SA}" \
            --quiet

      - name: Vérifier le service (santé + une analyse de texte)
        run: |
          set -euo pipefail
          URL="$RELAY_URL"
          {
            echo "## Relais Halcya déployé"
            echo
            echo "- Adresse : $URL"
            echo "- Image : \`$IMAGE:$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/health"
          echo
          status=$(curl -sS -o "$RUNNER_TEMP/smoke.json" -w '%{http_code}' --max-time 90 \
            -X POST "$URL/v1/meal/analyze" \
            -H 'Content-Type: application/json' -H "X-Install-Id: ci-smoke-${GITHUB_RUN_ID}" \
            -d '{"kind":"text","description":"une pomme et un yaourt nature"}')
          model=$(jq -r '.model // "—"' "$RUNNER_TEMP/smoke.json")
          dish=$(jq -r '.parsed.dish // .message // "—"' "$RUNNER_TEMP/smoke.json")
          count=$(jq -r '(.parsed.ingredients // []) | length' "$RUNNER_TEMP/smoke.json")
          echo "- Analyse de test : HTTP $status, modèle \`$model\`, « $dish », $count ingrédient(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP $status, modèle $model, plat « $dish », $count ingrédient(s)"
          if [ "$status" != "200" ] || [ "$count" = "0" ]; then
            # Message exact de Vertex AI (le relais ne journalise ni le contenu ni l'identifiant d'installation)
            # Cloud Logging met parfois plus d'une minute à indexer : on réessaie jusqu'à ~2 min
            for i in 1 2 3 4 5 6 7 8; do
              sleep 15
              gcloud logging read \
                "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND jsonPayload.event=\"error\"" \
                --project="$GCP_PROJECT" --limit=3 --freshness=15m \
                --format='value(timestamp,jsonPayload.status,jsonPayload.message)' > "$RUNNER_TEMP/errors.txt" 2>&1 || true
              [ -s "$RUNNER_TEMP/errors.txt" ] && break
            done
            sed 's/^/Journal du relais : /' "$RUNNER_TEMP/errors.txt" | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo "::error title=Analyse de test échouée::Le relais répond mais l'analyse Vertex AI n'a pas abouti (HTTP $status). Lire les journaux du service $SERVICE (Cloud Logging, événement « error ») : modèle absent de la région, ou rôle aiplatform.user manquant pour relay-runtime."
            exit 1
          fi

      - name: Notifications Google Play (abonnement push play-rtdn → relais)
        continue-on-error: true
        run: |
          set -uo pipefail
          SUB=play-rtdn-relay
          ENDPOINT="$RELAY_URL/pubsub/rtdn"
          common=(--project="$GCP_PROJECT" --push-endpoint="$ENDPOINT" \
            --push-auth-service-account="$RUNTIME_SA" --push-auth-token-audience="$ENDPOINT" \
            --ack-deadline=30 --message-retention-duration=1d \
            --min-retry-delay=10s --max-retry-delay=600s)
          if gcloud pubsub subscriptions describe "$SUB" --project="$GCP_PROJECT" --format='value(name)' >/dev/null 2>&1; then
            gcloud pubsub subscriptions update "$SUB" "${common[@]}" --quiet 2> "$RUNNER_TEMP/sub.err"
          else
            gcloud pubsub subscriptions create "$SUB" --topic=play-rtdn --expiration-period=never "${common[@]}" --quiet 2> "$RUNNER_TEMP/sub.err"
          fi
          rc=$?
          if [ "$rc" = "0" ]; then
            echo "- Notifications Play : abonnement push \`$SUB\` → \`$ENDPOINT\` (jeton OIDC de relay-runtime)" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/sub.err" >&2
            echo "- ⚠️ Notifications Play : abonnement \`$SUB\` non créé (voir le journal de l'étape)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Abonnement play-rtdn non créé::$(tail -1 "$RUNNER_TEMP/sub.err")"
            exit 1
          fi

      - name: Accès à Google Play (faux jeton d'achat, non bloquant)
        continue-on-error: true
        run: |
          set -uo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/verify.json" -w '%{http_code}' --max-time 30 \
            -X POST "$RELAY_URL/v1/subscription/verify" \
            -H 'Content-Type: application/json' -H "X-Install-Id: ci-smoke-${GITHUB_RUN_ID}" \
            -d '{"purchaseToken":"ci-faux-jeton-sans-achat-0000000000"}')
          case "$status" in
            404) verdict="✅ relay-runtime lit les achats Google Play (faux jeton reconnu comme inconnu)" ;;
            502) verdict="⏳ Google Play refuse encore relay-runtime (invitation pas encore active, ou droits manquants) : voir l'événement « error » route /v1/subscription/verify dans Cloud Logging" ;;
            *) verdict="❓ réponse inattendue HTTP $status" ;;
          esac
          echo "- Vérification d'achat : HTTP $status — $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP $status — $verdict"
          sleep 3
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND jsonPayload.route=\"/v1/subscription/verify\"" \
            --project="$GCP_PROJECT" --limit=1 --freshness=10m --format='value(jsonPayload.status,jsonPayload.message)' 2>/dev/null \
            | sed 's/^/Journal : /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          [ "$status" = "404" ]
