# GÉNÉRÉ par iphone/fusion/porter-workflows.mjs depuis spreadzenox/HealthTrack-iOS@d1dc912 (.github/workflows/store-beta.yml).
# Jusqu’à la bascule, ne pas modifier ce fichier : il est réécrit à chaque import (iphone/fusion/importer.sh).
# Examen bêta d'Apple (TestFlight externe) : relevé en lecture seule de l'état des builds du groupe « Testeurs Halcya »
# (scripts/store-beta.mjs ; décision du propriétaire du 06/11 vers 18:20 : relevé à chaque run, rien soumis ni changé
# dans App Store Connect). Que des lectures ; le lien public du groupe n'est jamais demandé ni affiché (dépôt public).
# Lancement manuel, sur main seulement (environnement `appstore` : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, jamais affichés).
name: TestFlight — examen bêta (relevé)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-beta
  cancel-in-progress: false

defaults:
  run:
    working-directory: iphone

jobs:
  # Garde de la bascule : ce workflow publie chez Apple. Il ne démarre que sur main, et seulement quand
  # iphone/fusion/bascule.json l'autorise (voir iphone/fusion/BASCULE.md). Sinon le job suivant est sauté.
  garde:
    name: Publication iOS activée ?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      publication: ${{ steps.garde.outputs.publication }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: iphone/fusion
      - id: garde
        run: fusion/garde.sh
  beta:
    name: État de l'examen bêta (lecture seule)
    needs: garde
    if: needs.garde.outputs.publication == 'oui'
    runs-on: ubuntu-latest
    environment: appstore
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # numéros de version = nombres de commits ; code suivi lu à son commit (scripts/upstream.sh)
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests du script
        run: node --test scripts/store-beta.test.mjs
      - name: Relevé (API App Store Connect, lecture seule)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/store-beta.mjs
