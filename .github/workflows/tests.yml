name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install frontend dependencies
        run: |
          cd app
          npm ci

      - name: Run frontend tests
        run: |
          cd app
          npm run test

  watch-java:
    name: Protocole montre (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Java protocol tests (JUnit, sans SDK Android)
        run: |
          cd app
          bash scripts/java-protocol-test.sh
