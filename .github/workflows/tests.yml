name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install frontend dependencies
        run: |
          cd app
          npm ci

      - name: Run frontend tests
        run: |
          cd app
          npm run test

  relay:
    name: Relais (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run relay tests (node:test, sans réseau)
        run: |
          cd relay
          npm test

  watch-java:
    name: Protocole montre (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Java protocol tests (JUnit, sans SDK Android)
        run: |
          cd app
          bash scripts/java-protocol-test.sh

  perf-budget:
    name: Budget de lectures (perf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install frontend dependencies and Chromium
        run: |
          cd app
          npm ci
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      # 3 ans de démo ; échoue si une page désérialise plus d'enregistrements que scripts/perf/budget.json
      - name: Check IndexedDB read budget per page
        run: |
          cd app
          npm run perf -- --budget --runs=1 --cpu=1
