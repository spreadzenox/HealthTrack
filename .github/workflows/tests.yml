name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install frontend dependencies
        run: |
          cd app
          npm ci

      - name: Lint (ESLint, 0 erreur)
        run: |
          cd app
          npm run lint

      - name: Run frontend tests
        run: |
          cd app
          npm run test

  relay:
    name: Relais (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run relay tests (node:test, sans réseau)
        run: |
          cd relay
          npm test

  watch-java:
    name: Protocole montre (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # JUnit et Hamcrest gardés d'un run à l'autre : Maven Central refuse parfois (404 le 31/10, 429 le 24/11),
      # et java-protocol-test.sh réutilise les jars déjà présents dans .java-test/lib.
      - name: Cache des jars de test (JUnit, Hamcrest)
        uses: actions/cache@v4
        with:
          path: app/.java-test/lib
          key: java-test-lib-junit-4.13.2-hamcrest-1.3

      - name: Run Java protocol tests (JUnit, sans SDK Android)
        run: |
          cd app
          bash scripts/java-protocol-test.sh

  perf-budget:
    name: Budget de lectures (perf)
    # 15/11 : ubuntu-latest passe à Ubuntu 26.04, où Playwright 1.56.1 refuse d'installer Chromium
    # (« Playwright does not support chromium on ubuntu26.04-x64 »). Épinglé sur 24.04 jusqu'à une version de
    # Playwright qui la prend en charge (CI-UBUNTU-26 au BACKLOG).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install frontend dependencies and Chromium
        run: |
          cd app
          npm ci
          npm install -g playwright@1.56.1
          playwright install chromium
          # 11/11 : apt (miroir Ubuntu d'Azure) tombait en panne DNS et rendait « Tests » rouge sans rapport avec le
          # code. L'image du runner a déjà les bibliothèques de Chromium : leur installation par apt est tentée,
          # bornée à 4 min, et son échec n'est qu'un avertissement (le budget ci-dessous échoue si Chromium ne démarre pas).
          timeout 240 sudo env "PATH=$PATH" playwright install-deps chromium \
            || echo "::warning::playwright install-deps a échoué (apt) ; on continue avec les bibliothèques du runner"

      # 3 ans de démo ; échoue si une page désérialise plus d'enregistrements que scripts/perf/budget.json
      - name: Check IndexedDB read budget per page
        run: |
          cd app
          npm run perf -- --budget --runs=1 --cpu=1
