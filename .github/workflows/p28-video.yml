# P28 — vidéo de la déclaration « Autorisations des services de premier plan » (Play Console), filmée par la CI.
#
# Filme sur un émulateur calqué sur le Galaxy A56 l'APK d'aperçu play (fr.jpesquet.sante.apercu, lecture au
# déverrouillage allumée) selon le script de journal/PLAY-CONFORMITE.md §1 bis : Sources → « Aussi à chaque
# déverrouillage » → divulgation → accord → notification « Lecture du visage active » avec « Arrêter » →
# verrouillage / déverrouillage (point vert de la caméra) → Accueil → « Arrêter ». Données de démonstration
# synthétiques ; dans la caméra virtuelle, un portrait du domaine public (NASA, déjà utilisé par les tests du
# pipeline visage), jamais visible dans la vidéo. Rien de réel.
#
# - Sur une PR qui touche ce workflow ou son script : filme et publie la vidéo en artefact seulement (vérification).
# - Lancé à la main sur main (Actions → « Play — vidéo P28 » → Run workflow) : publie aussi la vidéo à une adresse
#   publique stable, https://spreadzenox.github.io/HealthTrack/p28/ (via la release « p28-video », marquée
#   pré-version pour ne jamais apparaître comme mise à jour de l'app), puis relance le site GitHub Pages.
name: Play — vidéo P28

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p28-video.yml"
      - ".github/scripts/p28-video/**"

concurrency:
  group: p28-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  film:
    name: Filmer la lecture au déverrouillage (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 : WebSocket natif (protocole DevTools de la WebView)
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances npm
        working-directory: app
        run: npm ci

      - name: Build de l'app web (variante play)
        working-directory: app
        env:
          VITE_DISTRIBUTION: play
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Construire l'APK d'aperçu (interrupteur de la lecture au déverrouillage allumé)
        working-directory: app/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          chmod +x gradlew
          ./gradlew assemblePlayDebug -PfaceUnlockPlay=true -PplayPreview=true -PextraAbis=x86_64 --no-daemon
          cp app/build/outputs/apk/play/debug/app-play-debug.apk "$GITHUB_WORKSPACE/apercu.apk"

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Caméra frontale de l'émulateur = webcam virtuelle (v4l2loopback) qui diffuse le portrait. Si le module ne
      # se charge pas sur ce runner, la scène virtuelle de l'émulateur sert de secours (la vidéo montre quand même
      # la caméra s'ouvrir ; seule la nouvelle lecture du plan 7 peut manquer).
      - name: Webcam virtuelle avec le portrait
        id: cam
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg v4l2loopback-dkms "linux-headers-$(uname -r)" || sudo apt-get install -y -qq ffmpeg
          sudo modprobe v4l2loopback devices=1 video_nr=0 exclusive_caps=1 card_label=p28cam
          sudo chmod 666 /dev/video0
          nohup ffmpeg -loglevel error -re -loop 1 -i app/android/app/src/test/resources/face/face-frontal.png \
            -vf "scale=640:480:force_original_aspect_ratio=decrease,pad=640:480:(ow-iw)/2:(oh-ih)/2:color=white,format=yuyv422" \
            -r 15 -f v4l2 /dev/video0 > ffmpeg-cam.log 2>&1 &
          sleep 3
          v4l2-ctl --all -d /dev/video0 2>/dev/null | head -20 || true
          echo "camera=webcam0" >> "$GITHUB_OUTPUT"

      - name: Installer l'image système API 35
        run: |
          sdkmanager --no_https "platforms;android-35" "emulator" "system-images;android-35;google_apis;x86_64"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get install -y -qq ffmpeg; fi

      - name: "Créer l'AVD (Galaxy A56, 1080 × 2340, 385 ppi)"
        run: |
          echo "no" | avdmanager create avd --name a56 --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --force
          CFG="$HOME/.android/avd/a56.avd/config.ini"
          for kv in hw.lcd.width=1080 hw.lcd.height=2340 hw.lcd.density=385 hw.ramSize=6144 hw.sdCard=no hw.keyboard=no; do
            k="${kv%%=*}"; sed -i "/^${k}=/d" "$CFG"; echo "$kv" >> "$CFG"
          done

      - name: Filmer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: a56
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-front ${{ steps.cam.outputs.camera || 'virtualscene' }} -camera-back none
          disable-animations: false
          script: bash .github/scripts/p28-video/run.sh

      - name: Vidéo et images extraites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p28-video
          path: |
            p28-video.mp4
            p28-video.md
            p28-planche.png
            steps/
            frames/
            p28-logcat.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publier la vidéo (release « p28-video », pré-version) et relancer GitHub Pages
        if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp p28-video.mp4 halcya-face-unlock.mp4
          if gh release view p28-video >/dev/null 2>&1; then
            gh release upload p28-video halcya-face-unlock.mp4 --clobber
          else
            gh release create p28-video halcya-face-unlock.mp4 --prerelease --target main \
              --title "P28 — vidéo pour la Play Console" \
              --notes "Vidéo filmée par la CI (workflow « Play — vidéo P28 ») pour la déclaration « Autorisations des services de premier plan ». Ce n'est pas une version de l'app."
          fi
          gh workflow run pages.yml --ref main
          {
            echo ""
            echo "### Adresse publique"
            echo "- Page : https://spreadzenox.github.io/HealthTrack/p28/ (quelques minutes, le temps que « Site — GitHub Pages » finisse)"
            echo "- Fichier : https://github.com/${{ github.repository }}/releases/download/p28-video/halcya-face-unlock.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
