# Pages publiques de la version iPhone (politique de confidentialité, conditions, assistance : les adresses de la
# fiche App Store), construites par iphone/scripts/site.mjs : ce workflow CONSTRUIT et vérifie le site, il ne publie
# rien. La publication se fait par « Site — GitHub Pages » (pages.yml), sous /HealthTrack/iphone/ (FUSION-4, 26/11).
name: iOS — site (contrôle)

on:
  pull_request:
    branches: [main]
    paths: ["app/public/confidentialite-iphone.html", "app/public/conditions-iphone.html", "iphone/site/**", "iphone/scripts/site.mjs", ".github/workflows/pages.yml", ".github/workflows/ios-site.yml"]
  push:
    branches: [main]
    paths: ["app/public/confidentialite-iphone.html", "app/public/conditions-iphone.html", "iphone/site/**", "iphone/scripts/site.mjs", ".github/workflows/pages.yml", ".github/workflows/ios-site.yml"]

permissions:
  contents: read

concurrency:
  group: ios-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construire le site de l'iPhone (confidentialité, conditions, assistance)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            iphone
            app/public
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - working-directory: iphone
        run: node scripts/site.mjs _site
      - working-directory: iphone
        run: node --test site/site.test.mjs
