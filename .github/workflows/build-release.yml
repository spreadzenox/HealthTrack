# Build de l'app HealthTrack et création d'une GitHub Release avec l'APK.
# Déclenché à chaque push sur main. La version = run_number (tag v123, etc.).
name: Build & Release

on:
  push:
    branches: [main]
    # Un push qui ne touche que le journal de la routine ne change pas l'app :
    # pas de nouvelle release (sinon bannière de mise à jour pour rien).
    paths-ignore:
      - "journal/**"
      # Version iOS (routine iOS, journal/ios/README.md) : rien ne change côté Android
      - "app/ios/**"
      - "app/scripts/ios/**"
      - "app/store-ios/**"
      - ".github/workflows/ios-*.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build app & APK → Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build app (with version)
        working-directory: app
        env:
          VITE_APP_VERSION: ${{ github.run_number }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Le paquet par défaut « tools » n'existe plus dans les cmdline-tools récents
          # (« Failed to find package 'tools' ») : on n'installe que platform-tools.
          packages: platform-tools

      - name: Install Android platform and build-tools
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Create local.properties
        working-directory: app/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Make gradlew executable
        working-directory: app/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: app/android
        # Variante sideload (GitHub Releases, mise à jour en un clic) ; versionCode = numéro du run, toujours croissant
        run: ./gradlew assembleSideloadDebug -PhtVersionCode=${{ github.run_number }} --no-daemon

      - name: Create Release and upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.run_number }}"
          TAG="v${VERSION}"
          APK_PATH="app/android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk"
          APK_NAME="HealthTrack-${TAG}.apk"
          cp "$APK_PATH" "$APK_NAME"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "$APK_NAME" \
            --title "HealthTrack ${TAG}" \
            --notes "Build automatique après push sur main. Version ${VERSION}." \
            --latest