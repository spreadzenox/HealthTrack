# GÉNÉRÉ par iphone/fusion/porter-workflows.mjs depuis spreadzenox/HealthTrack-iOS@bad8351 (.github/workflows/store-push.yml).
# Jusqu’à la bascule, ne pas modifier ce fichier : il est réécrit à chaque import (iphone/fusion/importer.sh).
# Fiche App Store fr-FR (store/app-store/fr-FR) envoyée à App Store Connect par son API (I9) : nom, sous-titre,
# description, mots-clés, texte promotionnel, adresses d'assistance et de confidentialité, et, sur demande, les
# captures 6,9" de captures/store et iPad 13" de captures/store-ipad, sur la version encore « Prête à soumettre », dont
# le numéro prend celui des builds (versionCode d'Android suivi) sauf si une build y est attachée (choix du
# propriétaire), avec la catégorie et la classification par âge (classification.json). Rien n'est
# publié ni soumis à l'examen (geste du propriétaire). Lancement manuel, sur main seulement (environnement
# `appstore` : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, jamais affichés).
name: Fiche App Store — envoi

on:
  workflow_dispatch:
    inputs:
      captures:
        description: "Envoyer aussi les captures 6,9\" de la branche captures/store (à refaire et regarder avant)"
        type: boolean
        default: false
      captures_ipad:
        description: "Envoyer aussi les captures iPad 13\" de la branche captures/store-ipad (à refaire et regarder avant)"
        type: boolean
        default: false
      version_des_builds:
        description: "Build finale d'une soumission : renommer la version au numéro des builds même si une build y est attachée (le propriétaire choisit ensuite la nouvelle)"
        type: boolean
        default: false
      attacher_build:
        description: "Attacher à la version la plus récente build traitée par Apple de son numéro (build finale, décision du 05/11) ; jamais soumise"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: store-push
  cancel-in-progress: false

defaults:
  run:
    working-directory: iphone

jobs:
  # Garde de la bascule : ce workflow publie chez Apple. Il ne démarre que sur main, et seulement quand
  # iphone/fusion/bascule.json l'autorise (voir iphone/fusion/BASCULE.md). Sinon le job suivant est sauté.
  garde:
    name: Publication iOS activée ?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      publication: ${{ steps.garde.outputs.publication }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: iphone/fusion
      - id: garde
        run: fusion/garde.sh
  push:
    name: Envoi de la fiche fr-FR
    needs: garde
    if: needs.garde.outputs.publication == 'oui'
    runs-on: ubuntu-latest
    environment: appstore
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # numéros de version = nombres de commits ; code suivi lu à son commit (scripts/upstream.sh)
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Limites de la fiche
        run: node scripts/store-check.mjs
      - name: Captures de la fiche (branche captures/store)
        if: inputs.captures
        uses: actions/checkout@v4
        with:
          ref: captures/store
          path: iphone/captures-store
      - name: Captures iPad de la fiche (branche captures/store-ipad)
        if: inputs.captures_ipad
        uses: actions/checkout@v4
        with:
          ref: captures/store-ipad
          path: iphone/captures-ipad
      - name: Envoi (API App Store Connect)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/store-push.mjs ${{ inputs.captures && '--captures captures-store' || '' }} ${{ inputs.captures_ipad && '--captures-ipad captures-ipad' || '' }} ${{ inputs.version_des_builds && '--version-des-builds' || '' }} ${{ inputs.attacher_build && '--attacher-build' || '' }}
