name: Site — GitHub Pages

# Publie la politique de confidentialité (exigée par Google Play et Health Connect), les conditions d'utilisation
# et de vente (VC-18, /conditions/) et une courte page d'accueil :
#   https://spreadzenox.github.io/HealthTrack/confidentialite/
# Source unique : app/public/privacypolicy.html (aussi embarquée dans l'app). Voir journal/PRODUIT.md (P19).
on:
  push:
    branches: [main]
    paths:
      - "app/public/privacypolicy.html"
      - "app/public/conditions.html"
      - "app/scripts/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publier le site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}confidentialite/
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que GitHub Pages est activé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --jq '.build_type' > pages.txt 2>/dev/null; then
            {
              echo "### GitHub Pages n'est pas encore activé"
              echo ""
              echo "Action du propriétaire (P19 dans journal/PRODUIT.md) : GitHub → Settings → Pages →"
              echo "Build and deployment → Source : **GitHub Actions**, puis relancer ce workflow"
              echo "(Actions → « Site — GitHub Pages » → Run workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GitHub Pages n'est pas activé (Settings → Pages → Source : GitHub Actions)."
            exit 1
          fi
          if [ "$(cat pages.txt)" != "workflow" ]; then
            echo "### GitHub Pages est activé, mais pas avec la source « GitHub Actions » ($(cat pages.txt))" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Settings → Pages → Source : choisir « GitHub Actions » (actuellement : $(cat pages.txt))."
            exit 1
          fi
          echo "Pages activé (source : GitHub Actions)."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Construire le site
        run: node app/scripts/site/build-site.mjs _site

      # P28 : la vidéo filmée par la CI (workflow « Play — vidéo P28 », release pré-version « p28-video ») reste
      # publiée à chaque reconstruction du site, à https://spreadzenox.github.io/HealthTrack/p28/
      - name: Ajouter la vidéo P28 (si elle existe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download p28-video -R "${{ github.repository }}" -p halcya-face-unlock.mp4 -D _site/p28 2>/dev/null; then
            cat > _site/p28/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Halcya – face reading at unlock</title>
          <style>body{margin:0;background:#10231D;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:16px}
          video{max-width:100%;max-height:85vh;border-radius:12px}a{color:#5EE0B5}</style></head>
          <body><h1 style="font-size:1.1rem">Halcya – optional wellbeing check-in at phone unlock (Play review)</h1>
          <video src="halcya-face-unlock.mp4" controls playsinline muted></video>
          <p><a href="halcya-face-unlock.mp4">Download the video (MP4)</a> · Demo data, recorded on an emulator.</p>
          </body></html>
          EOF
            echo "Vidéo P28 ajoutée : $(du -h _site/p28/halcya-face-unlock.mp4 | cut -f1)"
          else
            echo "Pas encore de vidéo P28 (release p28-video absente)."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Résumé
        run: |
          echo "Politique de confidentialité publiée : ${{ steps.deployment.outputs.page_url }}confidentialite/" >> "$GITHUB_STEP_SUMMARY"
